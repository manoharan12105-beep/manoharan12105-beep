    <linearGradient id="panel" x1="692" y1="55" x2="1180" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101F2A"/>
      <stop offset="1" stop-color="#0B2028"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#5EEAD4" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.75 0 0 0 0 0.80 0 0 0 .35 0"/>
    </filter>
  </defs>
  <rect width="1280" height="390" rx="24" fill="url(#bg)"/>
