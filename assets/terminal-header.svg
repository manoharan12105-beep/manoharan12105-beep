  <text x="71" y="267" fill="#C5D5DE" font-family="Arial,Helvetica,sans-serif" font-size="17">Engineering solutions. Solving problems.</text>
  <text x="71" y="293" fill="#C5D5DE" font-family="Arial,Helvetica,sans-serif" font-size="17">Learning continuously.</text>
