<svg width="1280" height="390" viewBox="0 0 1280 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Manoharan M — Java Backend Developer</title>
  <desc id="desc">A dark terminal-inspired developer banner with cyan and teal accents.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="0" x2="1217" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131C"/>
      <stop offset="0.55" stop-color="#0B1721"/>
      <stop offset="1" stop-color="#092A31"/>
    </linearGradient>
    <linearGradient id="accent" x1="85" y1="50" x2="1150" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2DD4BF"/>
