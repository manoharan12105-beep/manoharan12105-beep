  <circle cx="1120" cy="10" r="150" fill="#0D9488" fill-opacity=".14" filter="url(#glow)"/>
  <circle cx="70" cy="365" r="130" fill="#0891B2" fill-opacity=".12" filter="url(#glow)"/>
  <path d="M42 42H1238" stroke="url(#accent)" stroke-opacity=".65" stroke-width="2"/>
  <path d="M42 349H1238" stroke="#5EEAD4" stroke-opacity=".18"/>
